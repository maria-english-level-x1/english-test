const PASS = 0.6;
let gi = 0, chosen = [], current = [], done = false;
const quiz = document.getElementById("quiz");
const stage = document.getElementById("stage");
const result = document.getElementById("result");
const finishBtn = document.getElementById("finish");
const nextBtn = document.getElementById("next");

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function showGroup() {
  quiz.innerHTML = "";
  result.innerHTML = "";
  nextBtn.style.display = "none";
  finishBtn.style.display = "block";
  stage.innerText = "Level " + groups[gi].name;
  current = groups[gi].qs;
  chosen = new Array(current.length).fill(null);
  current.forEach(function (item, qi) {
    const card = document.createElement("div");
    card.className = "card";
    const title = document.createElement("h3");
    title.innerText = (qi + 1) + ". " + item[0];
    card.appendChild(title);
    const btns = [];
    shuffle(item.slice(1)).forEach(function (text) {
      const b = document.createElement("button");
      b.className = "opt";
      b.innerText = text;
      b.onclick = function () {
        chosen[qi] = text;
        btns.forEach(function (x) { x.classList.remove("selected"); });
        b.classList.add("selected");
      };
      btns.push(b);
      card.appendChild(b);
    });
    quiz.appendChild(card);
  });
  window.scrollTo(0, 0);
}

finishBtn.onclick = function () {
  if (chosen.includes(null)) {
    result.innerText = "Please answer all the questions.";
    return;
  }
  let score = 0;
  current.forEach(function (item, i) {
    if (chosen[i] === item[1]) score++;
  });
  const passed = score / current.length >= PASS;
  finishBtn.style.display = "none";
  quiz.innerHTML = "";
  let msg = "Score: " + score + " / " + current.length + "<br>";
  if (passed && gi < groups.length - 1) {
    msg += "Great! Next: " + groups[gi + 1].name;
    nextBtn.innerText = "Go to " + groups[gi + 1].name;
    done = false;
  } else {
    const level = passed ? groups[gi].name : (gi > 0 ? groups[gi - 1].name : "below A1.1");
    msg += "Your level: " + level;
    nextBtn.innerText = "Start again";
    done = true;
  }
  result.innerHTML = msg;
  nextBtn.style.display = "block";
  window.scrollTo(0, 0);
};

nextBtn.onclick = function () {
  if (done) { gi = 0; } else { gi++; }
  showGroup();
};

showGroup();
  document.getElementById("enterBtn").onclick = enterTest;
document.getElementById("nameInput").onkeydown = function (e) {
  if (e.key === "Enter") enterTest();
};

function enterTest() {
  const name = document.getElementById("nameInput").value.trim();
  if (name === "") {
    document.getElementById("werr").innerText = "Please write your name • اكتب اسمك من فضلك";
    return;
  }
  const hello = document.getElementById("hello");
  hello.innerHTML = "";
  const ar = document.createElement("div");
  ar.dir = "rtl";
  ar.innerText = "مرحبا " + name + " في اختبار تحديد المستوى 🌸";
  const en = document.createElement("div");
  en.innerText = "Hello " + name + ", welcome to the level test! ✨";
  hello.appendChild(ar);
  hello.appendChild(en);
  document.getElementById("welcome").style.display = "none";
  document.getElementById("app").style.display = "block";
  window.scrollTo(0, 0);
}
